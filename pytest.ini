[pytest]
# corpus/ is harvested source material -- samples collected from other systems
# and kept as data. Several of those files are named test_*.py because that is
# what they were called where they came from, and pytest happily tried to
# import them as this repository's own tests, failing on modules that only
# ever existed in their original home (production_harness, and others).
#
# It is a data directory. Nothing in it is a test of this codebase.
norecursedirs = corpus corpus_archive lancedb_data chroma_db data .git
